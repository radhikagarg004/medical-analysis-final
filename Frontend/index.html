<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedVision AI | Aesthetic Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Gen-Z Pastel Palette */
            --bg: #fdf2f8; /* Soft Pink Background */
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary: #a855f7; /* Purple */
            --secondary: #ec4899; /* Pink */
            --text-dark: #4c1d95; /* Deep Purple Text */
            --text-light: #9d7bb8; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            overflow: hidden;
            position: relative;
        }

        /* Floating Aesthetic Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }
        .orb-1 { width: 350px; height: 350px; background: #fbcfe8; top: -50px; left: -50px; animation: float 6s infinite ease-in-out; }
        .orb-2 { width: 300px; height: 300px; background: #e9d5ff; bottom: -50px; right: -50px; animation: float 8s infinite ease-in-out reverse; }
        .orb-3 { width: 200px; height: 200px; background: #bae6fd; top: 40%; left: 30%; animation: float 10s infinite ease-in-out; }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(20px, 30px); }
            100% { transform: translate(0, 0); }
        }

        /* Glassmorphism Card */
        .login-card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid white;
            padding: 45px 35px;
            border-radius: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.15);
            text-align: center;
        }

        /* Aesthetic Icon */
        .logo-icon {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
            box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
            transform: rotate(-5deg);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 35px;
            font-weight: 600;
        }

        /* Input Fields */
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            margin-left: 10px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 20px;
            color: var(--primary);
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            background: #ffffff;
            border: 2px solid #f3e8ff;
            border-radius: 20px;
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .input-wrapper input::placeholder { color: #d8b4fe; }

        /* Gradient Button */
        .btn-login {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(236, 72, 153, 0.5);
        }

        .footer-text {
            margin-top: 30px;
            color: #c084fc;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-card">
        <div class="logo-icon">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>
        
        <h1>MedVision AI</h1>
        <p class="subtitle">Your Aesthetic Health Companion 🩺✨</p>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Doctor ID</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-doctor"></i>
                    <input type="text" id="doctorId" placeholder="e.g. DOC-101" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Let's Go! <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="footer-text">
            <i class="fa-solid fa-shield-halved"></i> 100% Secure & HIPAA Compliant
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const docId = document.getElementById('doctorId').value;
            if(docId) {
                localStorage.setItem('doctorId', docId);
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
